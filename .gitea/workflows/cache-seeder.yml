# Populates the caches .gitea/actions/go-setup restores everywhere else, see the comment there.
name: cache-seeder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - .golangci.yml
      - Makefile
      - .gitea/actions/go-setup/action.yml
      - .gitea/workflows/cache-seeder.yml

concurrency:
  group: cache-seeder
  cancel-in-progress: true

jobs:
  gobuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.gitea/actions/go-setup
      - run: make deps-tools build
      - name: warm the test compile cache
        run: | # -exec true compiles the test binaries without running them
          go test -race -cover -exec true ./...
          go test -tags e2e -exec true ./e2e/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.gitea/actions/go-setup
        with:
          lint-cache: "true"
      - run: make lint
