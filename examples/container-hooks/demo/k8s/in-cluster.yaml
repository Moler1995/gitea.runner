apiVersion: v1
kind: Namespace
metadata:
  name: container-hooks-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-hooks-demo
  namespace: container-hooks-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: container-hooks-demo
  namespace: container-hooks-demo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: container-hooks-demo
  namespace: container-hooks-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: container-hooks-demo
subjects:
  - kind: ServiceAccount
    name: container-hooks-demo
    namespace: container-hooks-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-hooks-demo
  namespace: container-hooks-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: container-hooks-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-hooks-demo
    spec:
      serviceAccountName: container-hooks-demo
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: runner
          image: gitea-runner:container-hooks-k8s-demo
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: runner-env
          env:
            - name: GITEA_HOOK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
