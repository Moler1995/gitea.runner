name: Sync upstream

on:
  schedule:
    # 08:00 Beijing time (00:00 UTC). GitHub may delay scheduled runs.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
    steps:
      - name: Sync
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --quiet --no-tags "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main

          git remote add upstream https://gitea.com/gitea/runner.git
          git fetch upstream --tags --force

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merge conflict with upstream/main. Resolve it locally, push, then rerun this workflow."
            exit 1
          fi

          git push origin HEAD:main
          git push origin --tags --force
